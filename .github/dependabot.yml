version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      expo-runtime:
        patterns:
          - expo
          - expo-*
          - "@expo/*"
          - react
          - react-dom
          - react-native
          - react-native-*
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /council-backoffice
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      council-console-runtime:
        patterns:
          - next
          - react
          - react-dom
          - "@supabase/*"
          - postgres
          - stripe
  - package-ecosystem: npm
    directory: /services/council-gateway
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
