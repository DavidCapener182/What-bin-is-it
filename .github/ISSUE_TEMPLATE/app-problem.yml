name: App problem
description: Report a reproducible app, PWA, reminder or accessibility problem.
title: "[App] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not post a private home address, notification token or council report reference.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iPhone / iPad
        - Android
        - Installed web app
        - Web browser
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 1.1.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
