appId: uk.whatbinistonight.app
name: Proof-safe Android predictive-back route semantics
tags:
  - proof-safe
  - android-only
  - predictive-back
---
- setAirplaneMode: disabled
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: deny
- extendedWaitUntil:
    visible: E2E Home
    timeout: 20000
- tapOn: Manage addresses
- assertVisible: Choose an address
- back
- assertVisible: E2E Home
- openLink:
    link: whatbinistonight:///settings
- tapOn:
    text: Open
    optional: true
- tapOn: Bin reminders
- assertVisible: Reminder settings
- back
- assertVisible: Settings
- back
- assertVisible: E2E Home
