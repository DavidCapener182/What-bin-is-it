appId: uk.whatbinistonight.app
name: Proof-safe onboarding and manual postcode validation
tags:
  - proof-safe
  - onboarding
  - manual-postcode
---
- setAirplaneMode: disabled
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: deny
- openLink:
    link: whatbinistonight:///onboarding
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible: Never guess bin night again
    timeout: 20000
- assertVisible: UK postcode
- tapOn: UK postcode
- inputText: NOTAPOSTCODE
- hideKeyboard
- tapOn: Find my collection
- assertVisible: Enter a full UK postcode, for example M1 1AE.
