appId: uk.whatbinistonight.app
name: Proof-safe bulky checkout cancellation return
tags:
  - proof-safe
  - bulky-checkout-return
---
- setAirplaneMode: disabled
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: deny
- openLink:
    link: whatbinistonight:///bulky-booking?booking=cancelled&reference=WB-E2E000000000
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible: What needs collecting?
    timeout: 20000
- assertVisible: Official council service
- assertVisible: No paid bulky-waste partner is approved for this council yet.
- assertNotVisible: Checking payment
- assertNotVisible: Confirm and pay
