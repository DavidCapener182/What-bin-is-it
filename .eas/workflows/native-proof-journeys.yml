name: Native proof journeys

on:
  workflow_dispatch: {}

jobs:
  build_android_e2e:
    name: Build Android proof APK
    type: build
    params:
      platform: android
      profile: e2e-test

  build_ios_e2e:
    name: Build iOS proof simulator app
    type: build
    params:
      platform: ios
      profile: e2e-test

  maestro_android:
    name: Run Android proof journeys
    needs: [build_android_e2e]
    type: maestro
    environment: preview
    runs_on: linux-large-nested-virtualization
    params:
      build_id: ${{ needs.build_android_e2e.outputs.build_id }}
      flow_path:
        - ./.maestro/common
        - ./.maestro/android
      include_tags: proof-safe
      maestro_version: 2.7.0
      android_system_image_package: system-images;android-35;default;x86_64
      device_identifier: pixel_6
      retries: 1
      retry_failed_only: true
      record_screen: true

  maestro_ios:
    name: Run iOS proof journeys
    needs: [build_ios_e2e]
    type: maestro
    environment: preview
    params:
      build_id: ${{ needs.build_ios_e2e.outputs.build_id }}
      flow_path:
        - ./.maestro/common
        - ./.maestro/ios
      include_tags: proof-safe
      maestro_version: 2.7.0
      retries: 1
      retry_failed_only: true
      record_screen: true
